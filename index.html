<html lang="id"><head><meta charset="utf-8">

<title>Stel Musik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1b1b1b;--line:rgba(255,255,255,.08);--fg:#f4f4f4;--mut:#8d8d8d;--ac:#6fcfae;--p:0%;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 "Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
.w{width:min(980px,100% - 32px);margin-inline:auto}
.nav{position:fixed;inset:0 0 auto;z-index:200;padding-top:env(safe-area-inset-top,0px);background:rgba(10,10,10,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #202020}
.nav .w{height:64px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:500;font-size:18px;letter-spacing:-.01em}.logo span{color:var(--ac)}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:8px;background:#191919;font-size:13px;color:#d6d6d6}
.hero{position:relative;padding:calc(104px + env(safe-area-inset-top,0px)) 0 36px;text-align:center}
.hero::before,.hero::after{content:"";position:absolute;inset:0 0 auto;height:560px;pointer-events:none}
.hero::before{background:linear-gradient(90deg,transparent 5%,rgba(255,255,255,.3) 50%,transparent 95%) top/100% 1px no-repeat,radial-gradient(ellipse 52% 95% at 50% 0,rgba(40,120,105,.34),rgba(120,75,35,.08) 58%,transparent 78%)}
.hero::after{background-image:radial-gradient(circle,rgba(255,255,255,.6) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.38) 0 1px,transparent 1.6px);background-size:97px 71px,151px 113px;background-position:13px 9px,61px 37px;-webkit-mask-image:radial-gradient(ellipse 52% 95% at 50% 0,#000,transparent 78%);mask-image:radial-gradient(ellipse 52% 95% at 50% 0,#000,transparent 78%)}
.hero>*{position:relative;z-index:1}
.cv{position:relative;height:clamp(230px,40vw,340px);perspective:1300px;-webkit-perspective:1300px;perspective-origin:50% 45%;overflow:hidden;margin:26px 0 8px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cd{position:absolute;left:50%;top:50%;width:clamp(150px,26vw,230px);aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;place-items:center;background-size:cover;background-position:center;box-shadow:0 30px 60px -10px rgba(0,0,0,.7);cursor:pointer;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .6s,filter .6s;-webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:transform}
.cd i{font-style:normal;font-size:clamp(48px,9vw,84px);color:rgba(255,255,255,.55)}
.cd.on{border:1px solid rgba(255,255,255,.28)}
.pl .cd{position:static;width:44px;border-radius:8px;box-shadow:none;transform:none;cursor:inherit}.pl .cd i{font-size:20px}
h1{font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:14px 0 4px}
.sub{color:#c4c4c4}
.bar{display:flex;align-items:center;gap:12px;max-width:560px;margin:22px auto 0;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;flex:1;min-width:0;cursor:pointer;touch-action:pan-y;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--p),var(--panel2) var(--p))}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--p),var(--panel2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:#fff;border:0}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0 14px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#cfcfcf;transition:transform .2s,background .2s,color .2s}
.ib:hover{background:var(--panel2);color:#fff}.ib[aria-pressed=true]{color:var(--ac)}.ib svg{width:20px;height:20px;fill:currentColor}
.ib.pp{width:64px;height:64px;background:#fff;color:#0a0a0a}.ib.pp:hover{background:#fff;transform:scale(1.06)}.ib.pp svg{width:26px;height:26px}
.vol{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--mut)}.vol[hidden]{display:none}.vol input{flex:none;width:130px}.vol svg{width:18px;height:18px;fill:currentColor}
.bs{max-width:420px;margin:18px auto 0;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.bs[hidden]{display:none}.bs .t{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500}.bs .t span{color:var(--ac);font-variant-numeric:tabular-nums}
.bs .r{display:flex;gap:6px;margin-top:6px}.bs .r input{flex:1}
.bs .ps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ch{padding:6px 12px;border-radius:7px;background:var(--panel2);font-size:12.5px;color:#ddd;border:1px solid transparent;transition:border-color .2s}.ch:hover{border-color:rgba(255,255,255,.4)}.ch[aria-pressed=true]{border-color:var(--ac);color:var(--ac)}
.bs small{display:block;margin-top:8px;color:var(--mut);font-size:12px}
.tag{display:inline-flex;gap:8px;align-items:center;padding:5px 12px;border-radius:8px;background:var(--panel2);font-size:12px;color:#d0d0d0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:44px 0 16px;flex-wrap:wrap}
.hd input{-webkit-appearance:none;appearance:none;width:min(260px,100%);font:inherit;font-size:16px;color:#fff;background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:9px 12px}
.hd input:focus{outline:0;border-color:rgba(255,255,255,.4)}
.pl{display:grid;gap:6px;padding-bottom:70px}
.it{display:grid;grid-template-columns:26px 44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);transition:border-color .25s,background .25s}
.it:hover{border-color:rgba(255,255,255,.5)}.it.on{border-color:rgba(111,207,174,.6);background:#161b19}
.it .n,.it .eq{grid-area:1/1}
.it .n{color:var(--mut);font-size:13px;text-align:center}.it b{display:block;font-weight:500;font-size:15px}.it small{color:var(--mut);font-size:12.5px}.it .d{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.eq{display:none;gap:2px;height:14px;align-items:flex-end;justify-content:center}.eq s{width:3px;background:var(--ac);border-radius:2px;animation:eq .9s ease-in-out infinite}.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
body.pl-on .it.on .n{display:none}body.pl-on .it.on .eq{display:flex}
.kosong{color:var(--mut);text-align:center;padding:30px 0}
footer{border-top:1px solid var(--line);padding:26px 16px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#777}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style></head>

<header class="nav"><div class="w"><span class="logo">Stel<span>Musik</span></span><span class="pill" id="cnt">0 lagu</span></div></header>
<main>
<section class="hero"><div class="w">
 <span class="tag" id="st">Siap diputar</span>
 <div class="cv" id="cv" aria-label="Sampul lagu"></div>
 <h1 id="jd">—</h1><p class="sub" id="ar">—</p>
 <div class="bar"><span id="t0">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posisi lagu"><span id="t1">0:00</span></div>
 <div class="ctl">
  <button class="ib" id="sh" aria-pressed="false" aria-label="Acak"><svg viewBox="0 0 24 24"><path d="M16 3h5v5l-2-2-4 4-1.4-1.4L17.6 4.6zM3 7h3.5c1.6 0 3 .8 3.9 2l5.4 7.5c.4.6 1 .9 1.7.9H18l-2-2 1.4-1.4L21 16l-3.6 3.6L16 18.2l2-2h-.5c-1.4 0-2.7-.7-3.5-1.8L8.6 7.9C8.2 7.3 7.6 7 6.9 7H3zm0 10h3.9c.7 0 1.3-.3 1.7-.9l.4-.6 1.2 1.7c-.8 1.1-2.1 1.8-3.3 1.8H3z"/></svg></button>
  <button class="ib" id="pv" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="ib pp" id="pp" aria-label="Putar"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ib" id="nx" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
  <button class="ib" id="rp" aria-pressed="false" aria-label="Ulangi"><svg viewBox="0 0 24 24" id="rpi"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
 </div>
 <div class="vol"><button class="ib" id="mt" aria-label="Bisukan" style="width:32px;height:32px"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button><input type="range" id="vl" min="0" max="100" value="70" aria-label="Volume"></div>
<div class="bs" id="bs"><div class="t"><label for="bv">Bass Boost</label><span id="bn">0%</span></div>
  <div class="r"><input type="range" id="bv" min="0" max="100" value="0" aria-label="Bass boost"></div>
  <div class="ps" id="bp"><button class="ch" data-v="0" aria-pressed="true">Mati</button><button class="ch" data-v="35" aria-pressed="false">Sedang</button><button class="ch" data-v="65" aria-pressed="false">Kuat</button><button class="ch" data-v="100" aria-pressed="false">Maksimal</button></div>
  <small id="bm">Pakai headphone/speaker yang bagus. Kalau suara pecah, turunkan bass.</small></div>
</div></section>
<section><div class="w">
 <div class="hd"><span class="tag">Daftar Putar</span><input id="q" type="search" placeholder="Cari judul atau artis…" aria-label="Cari lagu"></div>
 <div class="pl" id="pl"></div>
</div></section>
</main>
<footer>StelMusik · Spasi: putar/jeda · ← → : maju/mundur 5 dtk · Shift + ← →: lagu sebelumnya/berikutnya</footer>
<audio id="au" preload="metadata"></audio>
<script>
// ===== DAFTAR LAGU =====
// Tambah lagu: taruh file mp3 di folder yang sama dengan index.html, lalu tambah satu baris di bawah.
// cover (opsional): nama file gambar di folder yang sama, mis. "great.jpg". Kosong = cover otomatis.
var LAGU = [
  { judul: "Great", artis: "Lagu Contoh", file: "great.mp3", cover: "" },
  // { judul: "Judul Lagu", artis: "Nama Artis", file: "nama-file.mp3", cover: "" },
];
// =======================
(function(){
var $=function(s){return document.querySelector(s)},L=LAGU,N=L.length,au=$('#au'),i=0,sh=0,rp=0,hist=[],dur={};
var S={};try{S=JSON.parse(localStorage.getItem('stelmusik')||'{}')}catch(_){}
var RP=['<path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/>','<path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2zm-5-5.5V9.5h-1v-1h2v3z"/>'];
var bass=S.b||0,ctx,fx;
function save(){try{localStorage.setItem('stelmusik',JSON.stringify({i:i,sh:sh,rp:rp,v:au.volume,b:bass}))}catch(_){}}
// Bass boost (Web Audio). Dibuat hanya saat dipakai supaya pemutaran biasa tetap aman.
function fxOK(){return(window.AudioContext||window.webkitAudioContext)&&location.protocol!=='file:'}
function ensureFx(){if(fx)return fx;if(!fxOK())return null;try{var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();var src=ctx.createMediaElementSource(au),a=ctx.createBiquadFilter(),b=ctx.createBiquadFilter(),g=ctx.createGain(),c=ctx.createDynamicsCompressor();
a.type='lowshelf';a.frequency.value=140;b.type='peaking';b.frequency.value=65;b.Q.value=1;c.threshold.value=-8;c.knee.value=12;c.ratio.value=4;c.attack.value=.005;c.release.value=.2;
src.connect(a);a.connect(b);b.connect(g);g.connect(c);c.connect(ctx.destination);fx={a:a,b:b,g:g}}catch(_){fx=null}return fx}
function applyBass(){var k=bass/100,f=ensureFx();if(!f)return;var t=ctx.currentTime;f.a.gain.setTargetAtTime(k*14,t,.05);f.b.gain.setTargetAtTime(k*6,t,.05);f.g.gain.setTargetAtTime(1-k*.3,t,.05)}
function bassUI(){$('#bv').value=bass;$('#bv').style.setProperty('--p',bass+'%');$('#bn').textContent=bass+'%';document.querySelectorAll('#bp .ch').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.v===bass)})}
function setBass(v){bass=v;bassUI();if(bass>0||fx){applyBass();if(ctx&&ctx.state!=='running')ctx.resume()}save()}
function gest(){if(bass>0&&!fx){applyBass()}if(ctx&&ctx.state!=='running')ctx.resume()}
['pointerdown','touchend','keydown'].forEach(function(e){addEventListener(e,gest,true)});
function fmt(t){if(!isFinite(t))return'0:00';var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
function bg(l){if(l.cover)return'url("'+l.cover+'")';var h=0;for(var k=0;k<l.judul.length;k++)h=(h*31+l.judul.charCodeAt(k))%360;return'linear-gradient(135deg,hsl('+h+',55%,34%),hsl('+(h+50)+',60%,13%))'}
function cover(l){var d=document.createElement('div');d.className='cd';d.style.backgroundImage=bg(l);if(!l.cover){var n=document.createElement('i');n.textContent='♪';d.appendChild(n)}return d}
var cv=$('#cv'),cds=L.map(function(l,k){var d=cover(l);d.onclick=function(){k===i?toggle():load(k,true)};cv.appendChild(d);return d});
function place(){var w=cv.clientWidth,s=Math.min(w*.3,230)*.95;cds.forEach(function(d,k){var o=k-i,a=Math.abs(o);d.style.transform='translate(-50%,-50%) translate3d('+(o*s)+'px,0,'+(-Math.min(a,3)*150)+'px) rotateY('+(Math.max(-1,Math.min(1,o))*-32*Math.min(a,1.4))+'deg) scale('+(1-Math.min(a,3)*.06)+')';d.style.opacity=a>3?0:Math.max(.25,1-a*.28);d.style.filter=a?'blur('+Math.min(a*2,5)+'px) brightness(.7)':'none';d.style.zIndex=100-a;d.style.pointerEvents=a>3?'none':'auto';d.classList.toggle('on',!a)})}
addEventListener('resize',place);
var pl=$('#pl');
function list(q){q=(q||'').toLowerCase();pl.innerHTML='';var n=0;L.forEach(function(l,k){if(q&&(l.judul+' '+l.artis).toLowerCase().indexOf(q)<0)return;n++;
var b=document.createElement('button');b.className='it'+(k===i?' on':'');b.dataset.k=k;
b.innerHTML='<span class="n"></span><span class="eq"><s></s><s></s><s></s></span>';b.firstChild.textContent=k+1;
b.appendChild(cover(l));var t=document.createElement('span');t.innerHTML='<b></b><small></small>';t.firstChild.textContent=l.judul;t.lastChild.textContent=l.artis;b.appendChild(t);
var d=document.createElement('span');d.className='d';d.textContent=dur[k]?fmt(dur[k]):'';b.appendChild(d);
b.onclick=function(){k===i?toggle():load(k,true)};pl.appendChild(b)});
if(!n){pl.innerHTML='<p class="kosong">'+(N?'Lagu tidak ditemukan.':'Belum ada lagu. Isi daftar LAGU di index.html.')+'</p>'}}
$('#q').oninput=function(){list(this.value)};
function load(k,play){i=(k+N)%N;var l=L[i];au.src=l.file;$('#jd').textContent=l.judul;$('#ar').textContent=l.artis;document.title=l.judul+' · '+l.artis;prog();place();
document.querySelectorAll('.it').forEach(function(b){b.classList.toggle('on',+b.dataset.k===i)});save();
if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:l.judul,artist:l.artis,artwork:l.cover?[{src:l.cover}]:[]})}
if(play)au.play().catch(function(){$('#st').textContent='Ketuk putar untuk mulai'})}
function toggle(){if(!N)return;if(!au.src)load(i,true);else au.paused?au.play().catch(function(){}):au.pause()}
function next(){if(!N)return;hist.push(i);var k=i+1;if(sh&&N>1){do{k=Math.floor(Math.random()*N)}while(k===i)}load(k,true)}
function prev(){if(!N)return;if(au.currentTime>3){au.currentTime=0;return}load(hist.length?hist.pop():i-1,true)}
function prog(){var d=au.duration||0,t=au.currentTime||0,p=d?t/d*1000:0;$('#sk').value=p;$('#sk').style.setProperty('--p',(p/10)+'%');$('#t0').textContent=fmt(t);$('#t1').textContent=fmt(d)}
au.ontimeupdate=prog;au.onloadedmetadata=function(){dur[i]=au.duration;prog();var d=document.querySelector('.it[data-k="'+i+'"] .d');if(d)d.textContent=fmt(au.duration)};
au.onplay=function(){$('#ppi').innerHTML='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';$('#pp').setAttribute('aria-label','Jeda');document.body.classList.add('pl-on');$('#st').textContent='Sedang diputar'};
au.onpause=function(){$('#ppi').innerHTML='<path d="M8 5v14l11-7z"/>';$('#pp').setAttribute('aria-label','Putar');document.body.classList.remove('pl-on');$('#st').textContent='Dijeda'};
au.onended=function(){if(rp===2){au.currentTime=0;au.play()}else if(rp===1||i<N-1||sh)next();else{au.currentTime=0;$('#st').textContent='Selesai'}};
au.onerror=function(){$('#st').textContent='File lagu tidak ditemukan'};
$('#sk').oninput=function(){if(au.duration)au.currentTime=this.value/1000*au.duration;this.style.setProperty('--p',(this.value/10)+'%')};
$('#pp').onclick=toggle;$('#nx').onclick=next;$('#pv').onclick=prev;
$('#sh').onclick=function(){sh=sh?0:1;this.setAttribute('aria-pressed',!!sh);save()};
function rpUI(){var b=$('#rp');b.setAttribute('aria-pressed',rp>0);b.setAttribute('aria-label',['Ulangi: mati','Ulangi semua','Ulangi satu lagu'][rp]);$('#rpi').innerHTML=RP[rp===2?1:0]}
$('#rp').onclick=function(){rp=(rp+1)%3;rpUI();save()};
$('#vl').oninput=function(){au.volume=this.value/100;au.muted=false;this.style.setProperty('--p',this.value+'%');save()};
$('#mt').onclick=function(){au.muted=!au.muted;this.style.color=au.muted?'var(--ac)':''};
addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
else if(e.key==='ArrowRight'){e.shiftKey?next():au.currentTime+=5}else if(e.key==='ArrowLeft'){e.shiftKey?prev():au.currentTime-=5}else if(e.key==='m'||e.key==='M')$('#mt').click()});
if('mediaSession'in navigator){[['seekforward',function(){au.currentTime+=10}],['seekbackward',function(){au.currentTime-=10}],['play',toggle],['pause',toggle],['previoustrack',prev],['nexttrack',next]].forEach(function(a){try{navigator.mediaSession.setActionHandler(a[0],a[1])}catch(_){}})}
var sx=0,sw=0;cv.addEventListener('pointerdown',function(e){sx=e.clientX;sw=0});cv.addEventListener('pointerup',function(e){var d=e.clientX-sx;if(Math.abs(d)>50){sw=1;d<0?next():prev()}});cv.addEventListener('click',function(e){if(sw){e.stopPropagation();e.preventDefault();sw=0}},true);
$('#cnt').textContent=N+' lagu';
if(!fxOK()){$('#bv').disabled=true;document.querySelectorAll('#bp .ch').forEach(function(b){b.disabled=true});$('#bm').textContent=location.protocol==='file:'?'Bass boost aktif setelah dibuka lewat github.io (bukan dari file lokal).':'Browser ini tidak mendukung bass boost.'}
$('#bv').oninput=function(){setBass(+this.value)};
document.querySelectorAll('#bp .ch').forEach(function(b){b.onclick=function(){setBass(+b.dataset.v)}});
bassUI();
sh=S.sh?1:0;rp=S.rp||0;$('#sh').setAttribute('aria-pressed',!!sh);rpUI();
// iOS tidak mengizinkan volume diatur lewat web: sembunyikan slider
